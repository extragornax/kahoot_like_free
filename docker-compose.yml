services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kahoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kahoot}
      POSTGRES_DB: ${POSTGRES_DB:-kahoot}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kahoot"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kahoot}:${POSTGRES_PASSWORD:-kahoot}@db:5432/${POSTGRES_DB:-kahoot}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      POW_SECRET: ${POW_SECRET:?POW_SECRET must be set (see .env.example)}
      APP_BASE_URL: ${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
      - uploads:/app/static/uploads

volumes:
  pgdata:
  cargo-cache:
  target-cache:
  uploads:
