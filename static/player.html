<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kahoot Free - Play</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Root font scales with viewport: ~25px on 390px phone, ~32px on 500px, caps at 32px */
        html { font-size: clamp(24px, 6.5vw, 32px); }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #46178f;
            color: #fff;
            height: 100dvh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            padding: 5vw;
            text-align: center;
            animation: screenFadeIn 0.35s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes screenFadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ── Join screen ── */

        #join-screen .title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 6vh;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #join-screen .form {
            width: 92%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        #join-screen input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: none;
            border-radius: 0.5rem;
            text-align: center;
            outline: none;
            font-weight: 700;
            color: #333;
        }

        #pin-input::placeholder,
        #nickname-input::placeholder {
            color: #999;
            font-weight: 400;
        }

        #join-btn {
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 0.5rem;
            background: #fff;
            color: #46178f;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #join-btn:active { transform: scale(0.96); }

        #join-error {
            color: #ff6b6b;
            font-size: 0.7rem;
            min-height: 1em;
            font-weight: 600;
        }

        /* ── Waiting screen ── */

        #waiting-screen .nickname-display {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 3vh;
        }

        #waiting-screen .waiting-text {
            font-size: 0.9rem;
            opacity: 0.85;
            animation: pulse 1.5s ease-in-out infinite;
        }

        #waiting-screen .reaction-bar {
            margin-top: 4vh;
            display: flex;
            gap: 0.5rem;
            background: rgba(0,0,0,0.25);
            padding: 0.45rem 0.6rem;
            border-radius: 999px;
        }

        .reaction-btn {
            font-size: 1.6rem;
            background: rgba(255,255,255,0.12);
            border: none;
            border-radius: 50%;
            width: 2.4rem;
            height: 2.4rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
        }

        .reaction-btn:active { transform: scale(0.85); }
        .reaction-btn:hover { background: rgba(255,255,255,0.22); }
        .reaction-btn[disabled] { opacity: 0.5; cursor: not-allowed; }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ── Question screen ── */

        #question-screen {
            justify-content: flex-start;
            padding: 0;
        }

        .timer-bar-container {
            width: 100%;
            height: 0.3rem;
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .timer-bar {
            height: 100%;
            background: #fff;
            width: 100%;
        }

        .timer-bar.running { animation: shrink-bar linear forwards; }
        @keyframes shrink-bar { from { width: 100%; } to { width: 0%; } }

        .question-header {
            width: 100%;
            padding: 0.5rem 0.7rem 0.3rem;
            flex-shrink: 0;
        }

        .question-counter {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-bottom: 0.15rem;
        }

        .question-text {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .answers-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0.25rem 0.4rem 0.4rem;
            overflow: hidden;
        }

        .open-input-row {
            width: 100%;
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 0.6rem 0.8rem;
        }
        .open-input-row input {
            flex: 1;
            padding: 0.9rem 1rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            outline: none;
        }
        .open-input-row button {
            padding: 0.9rem 1.4rem;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            background: #26890c;
            color: #fff;
            cursor: pointer;
        }
        .open-input-row button:disabled { opacity: 0.5; }

        .answer-btn {
            flex: 1;
            border: none;
            border-radius: 0.4rem;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.6rem;
            transition: transform 0.1s, opacity 0.15s;
            text-align: left;
        }

        .answer-btn:active:not(:disabled) { transform: scale(0.97); }
        .answer-btn:disabled { opacity: 0.5; cursor: default; }

        .answer-btn .shape {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 1.4rem;
            text-align: center;
        }

        .answer-btn .answer-text { flex: 1; line-height: 1.2; }

        .answer-btn.red    { background: #e21b3c; }
        .answer-btn.blue   { background: #1368ce; }
        .answer-btn.green  { background: #26890c; }
        .answer-btn.yellow { background: #d89e00; }
        .answer-btn.purple { background: #863bba; }
        .answer-btn.teal   { background: #009d9a; }

        .question-image-player { max-height: 12vh; max-width: 90%; border-radius: 0.3rem; margin-bottom: 0.3rem; object-fit: contain; }

        /* ── Answered screen ── */

        #answered-screen .checkmark { font-size: 3rem; margin-bottom: 2vh; }
        #answered-screen .submitted-text { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5vh; }
        #answered-screen .waiting-text { font-size: 0.85rem; opacity: 0.7; animation: pulse 1.5s ease-in-out infinite; }

        /* ── Result screen ── */

        #result-screen .result-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5vh;
            animation: resultPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes resultPop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        #result-screen .streak-badge {
            display: none;
            align-items: center;
            gap: 0.3rem;
            font-size: 1.05rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff8a00, #ff3d00);
            color: #fff;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            margin-bottom: 0.8vh;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 0 0 rgba(255,138,0,0.6);
            animation: streakPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275), streakGlow 1.6s ease-in-out infinite 0.5s;
        }
        #result-screen .streak-badge.visible { display: inline-flex; }
        #result-screen .streak-badge .streak-flame { font-size: 1.3rem; line-height: 1; }
        #result-screen .streak-badge .streak-bonus { opacity: 0.9; font-size: 0.85rem; font-weight: 700; margin-left: 0.3rem; }

        @keyframes streakPop {
            0% { transform: scale(0.4) rotate(-12deg); opacity: 0; }
            70% { transform: scale(1.15) rotate(2deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        @keyframes streakGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(255,138,0,0); }
            50% { box-shadow: 0 0 16px rgba(255,138,0,0.7); }
        }

        #result-screen .points-earned { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.8vh; animation: slideUp 0.4s ease 0.2s both; }
        #result-screen .answer-recap {
            width: 90%; max-width: 360px;
            font-size: 0.75rem;
            margin-bottom: 1vh;
            animation: slideUp 0.4s ease 0.3s both;
            display: flex; flex-direction: column; gap: 0.3rem;
        }
        #result-screen .answer-recap .recap-row {
            background: rgba(255,255,255,0.12);
            border-radius: 0.4rem;
            padding: 0.35rem 0.6rem;
            text-align: left;
        }
        #result-screen .answer-recap .recap-label { opacity: 0.7; font-size: 0.65rem; }
        #result-screen .answer-recap .recap-value { font-weight: 700; word-break: break-word; }
        #result-screen .answer-recap .recap-row.correct { background: rgba(46,204,113,0.25); }
        #result-screen .answer-recap .recap-row.wrong { background: rgba(231,76,60,0.25); }
        #result-screen .speed-stats { font-size: 0.7rem; opacity: 0.8; margin-bottom: 1vh; animation: slideUp 0.4s ease 0.4s both; }

        #result-screen .speed-bar-container {
            width: 75%; max-width: 320px; height: 0.3rem;
            background: rgba(255,255,255,0.15); border-radius: 0.15rem;
            margin-bottom: 1.5vh; overflow: hidden;
            animation: slideUp 0.4s ease 0.4s both;
        }

        #result-screen .speed-bar { height: 100%; border-radius: 0.15rem; background: #2ecc71; transition: width 0.8s ease 0.6s; }
        #result-screen .total-score { font-size: 0.9rem; opacity: 0.85; margin-bottom: 0.5vh; animation: slideUp 0.4s ease 0.5s both; }
        #result-screen .rank-display { font-size: 0.8rem; opacity: 0.7; animation: slideUp 0.4s ease 0.6s both; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ── Final screen ── */

        #final-screen .game-over-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 2vh; }
        #final-screen .final-rank { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.8vh; }
        #final-screen .final-score { font-size: 0.9rem; opacity: 0.85; margin-bottom: 2.5vh; }

        .leaderboard { width: 92%; max-width: 440px; margin-bottom: 2.5vh; }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.45rem 0.6rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.4rem;
            margin-bottom: 0.25rem;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .leaderboard-row .lb-rank { width: 1.5rem; text-align: left; opacity: 0.7; }
        .leaderboard-row .lb-name { flex: 1; text-align: left; }

        .leaderboard-row .lb-score {
            text-align: right;
            opacity: 0.8;
        }

        .play-again-btn {
            padding: 0.6rem 2rem;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            border-radius: 0.5rem;
            background: #fff;
            color: #46178f;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .play-again-btn:active { transform: scale(0.96); }

        /* ── Error screen ── */

        #error-screen .error-icon { font-size: 2.5rem; margin-bottom: 2vh; opacity: 0.8; }
        #error-screen .error-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 1.5vh; }
        #error-screen .error-reason { font-size: 0.85rem; opacity: 0.75; margin-bottom: 3vh; }
    </style>
</head>
<body>

    <!-- 1. Join screen -->
    <div id="join-screen" class="screen active">
        <div class="title">Kahoot Free</div>
        <div class="form">
            <input id="pin-input" type="tel" maxlength="6" placeholder="Game PIN" inputmode="numeric" autocomplete="off">
            <input id="nickname-input" type="text" maxlength="20" placeholder="Nickname" autocomplete="off">
            <button id="join-btn">Join!</button>
            <div id="join-error"></div>
        </div>
    </div>

    <!-- 2. Waiting screen -->
    <div id="waiting-screen" class="screen">
        <div id="waiting-avatar" style="font-size:3.5rem; margin-bottom:1vh;"></div>
        <div class="nickname-display" id="waiting-nickname"></div>
        <div class="waiting-text">Waiting for host to start...</div>
        <div class="reaction-bar" id="reaction-bar"></div>
    </div>

    <!-- 3. Question screen -->
    <div id="question-screen" class="screen">
        <div class="timer-bar-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>
        <div class="question-header">
            <div class="question-counter" id="question-counter"></div>
            <div class="question-text" id="question-text"></div>
            <img class="question-image-player" id="question-image" style="display:none">
        </div>
        <div class="answers-container" id="answers-container"></div>
    </div>

    <!-- 3b. Slide / Section screen -->
    <div id="slide-screen" class="screen">
        <div class="question-header">
            <div class="question-counter" id="slide-counter"></div>
            <div class="question-text" id="slide-text"></div>
            <img class="question-image-player" id="slide-image" style="display:none">
        </div>
        <div class="waiting-text">👀 Look at the main screen</div>
    </div>

    <!-- 3c. Open answer input screen -->
    <div id="open-answer-screen" class="screen">
        <div class="question-header">
            <div class="question-counter" id="open-counter"></div>
            <div class="question-text" id="open-text"></div>
            <img class="question-image-player" id="open-image" style="display:none">
        </div>
        <div class="open-input-row">
            <input type="text" id="open-input" maxlength="200" placeholder="Type your answer...">
            <button id="open-submit-btn">Submit</button>
        </div>
    </div>

    <!-- 3e. Numeric answer input screen -->
    <div id="numeric-screen" class="screen">
        <div class="timer-bar-container">
            <div class="timer-bar" id="numeric-timer-bar"></div>
        </div>
        <div class="question-header">
            <div class="question-counter" id="numeric-counter"></div>
            <div class="question-text" id="numeric-text"></div>
            <img class="question-image-player" id="numeric-image" style="display:none">
            <div style="font-size:0.7rem; opacity:0.7; margin-top:1vh;">Closest answer wins. Top 3 score.</div>
        </div>
        <div class="open-input-row">
            <input type="text" id="numeric-input" inputmode="decimal" placeholder="Your number" autocomplete="off">
            <button id="numeric-submit-btn">Submit</button>
        </div>
    </div>

    <!-- 3d. Voting screen -->
    <div id="vote-screen" class="screen">
        <div class="question-header">
            <div class="question-counter">Vote for the best answer</div>
        </div>
        <div class="answers-container" id="vote-options"></div>
    </div>

    <!-- 4. Answered screen -->
    <div id="answered-screen" class="screen">
        <div class="checkmark">✔</div>
        <div class="submitted-text">Answer submitted!</div>
        <div class="waiting-text">Waiting for everyone...</div>
    </div>

    <!-- 5. Result screen -->
    <div id="result-screen" class="screen">
        <div class="result-icon" id="result-icon"></div>
        <div class="streak-badge" id="streak-badge"></div>
        <div class="points-earned" id="points-earned"></div>
        <div class="answer-recap" id="answer-recap"></div>
        <div class="speed-stats" id="speed-stats"></div>
        <div class="speed-bar-container"><div class="speed-bar" id="speed-bar"></div></div>
        <div class="total-score" id="total-score"></div>
        <div class="rank-display" id="rank-display"></div>
    </div>

    <!-- 6. Final screen -->
    <div id="final-screen" class="screen">
        <div class="game-over-title">Game Over!</div>
        <div class="final-rank" id="final-rank"></div>
        <div class="final-score" id="final-score"></div>
        <div class="leaderboard" id="leaderboard"></div>
        <button class="play-again-btn" id="play-again-btn">Play Again</button>
    </div>

    <!-- 7. Error screen -->
    <div id="error-screen" class="screen">
        <div class="error-icon">⚡</div>
        <div class="error-title" id="error-title">Disconnected</div>
        <div class="error-reason" id="error-reason"></div>
        <button class="play-again-btn" id="rejoin-btn">Rejoin</button>
    </div>

    <div id="reconnect-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#e21b3c;color:#fff;text-align:center;padding:8px;z-index:2000;font-weight:600;">Reconnecting…</div>

    <div id="game-background" style="position:fixed;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:0.25;z-index:-1;pointer-events:none;display:none;"></div>

    <button id="sfx-toggle" title="Toggle sound effects" style="position:fixed;bottom:12px;right:12px;z-index:60;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:20px;padding:8px 12px;font-size:1rem;cursor:pointer;">&#128266;</button>

    <script>
        // ── Sound Effects (synthesized via Web Audio API) ──
        const sfx = (() => {
            let ctx = null;
            let muted = localStorage.getItem('kahoot_sfx_muted') === '1';

            function ensureCtx() {
                if (!ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return null;
                    ctx = new AC();
                }
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                return ctx;
            }

            function tone({ freq, type = 'sine', duration = 0.15, delay = 0, gain = 0.15, freqEnd = null }) {
                const c = ensureCtx();
                if (!c) return;
                const osc = c.createOscillator();
                const g = c.createGain();
                const start = c.currentTime + delay;
                osc.type = type;
                osc.frequency.setValueAtTime(freq, start);
                if (freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), start + duration);
                g.gain.setValueAtTime(0.0001, start);
                g.gain.linearRampToValueAtTime(gain, start + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.connect(g).connect(c.destination);
                osc.start(start);
                osc.stop(start + duration + 0.05);
            }

            const effects = {
                pop: () => tone({ freq: 660, duration: 0.09, gain: 0.12, freqEnd: 1100 }),
                go: () => {
                    tone({ freq: 523.25, duration: 0.1, gain: 0.1 });
                    tone({ freq: 783.99, duration: 0.16, gain: 0.1, delay: 0.09 });
                },
                tap: () => tone({ freq: 600, type: 'triangle', duration: 0.04, gain: 0.08 }),
                correct: () => {
                    tone({ freq: 659.25, type: 'triangle', duration: 0.12, gain: 0.12 });
                    tone({ freq: 783.99, type: 'triangle', duration: 0.12, gain: 0.12, delay: 0.1 });
                    tone({ freq: 1046.5, type: 'triangle', duration: 0.22, gain: 0.12, delay: 0.2 });
                },
                wrong: () => {
                    tone({ freq: 329.63, type: 'sawtooth', duration: 0.18, gain: 0.08 });
                    tone({ freq: 196, type: 'sawtooth', duration: 0.28, gain: 0.08, delay: 0.14 });
                },
                fanfare: () => {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((f, i) => tone({ freq: f, type: 'triangle', duration: 0.55, gain: 0.13, delay: i * 0.11 }));
                },
            };

            return {
                play(name) {
                    if (muted) return;
                    try { effects[name] && effects[name](); } catch (e) {}
                },
                setMuted(v) {
                    muted = !!v;
                    localStorage.setItem('kahoot_sfx_muted', muted ? '1' : '0');
                },
                isMuted: () => muted,
            };
        })();

        // ── Lobby reactions ──
        const REACTIONS = ['👍', '❤️', '😂', '😮', '🎉', '🔥'];
        const reactionBar = document.getElementById('reaction-bar');
        REACTIONS.forEach(emoji => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'reaction-btn';
            btn.textContent = emoji;
            btn.addEventListener('click', () => sendReaction(emoji, btn));
            reactionBar.appendChild(btn);
        });

        function sendReaction(emoji, btn) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: 'reaction', emoji }));
            sfx.play('tap');
            // 800ms per-button cooldown to discourage hammering.
            btn.disabled = true;
            setTimeout(() => { btn.disabled = false; }, 800);
        }

        const sfxToggleBtn = document.getElementById('sfx-toggle');
        function refreshSfxToggle() {
            sfxToggleBtn.innerHTML = sfx.isMuted() ? '&#128263;' : '&#128266;';
            sfxToggleBtn.style.opacity = sfx.isMuted() ? '0.55' : '1';
        }
        refreshSfxToggle();
        sfxToggleBtn.addEventListener('click', () => {
            sfx.setMuted(!sfx.isMuted());
            if (!sfx.isMuted()) sfx.play('pop');
            refreshSfxToggle();
        });

        // ── State ──
        let ws = null;
        let nickname = '';
        let currentPin = '';
        let reconnectTries = 0;
        let reconnectTimer = null;
        const MAX_RECONNECT = 8;
        const SESSION_KEY = 'kahoot_player_session';

        function saveSession() {
            try { localStorage.setItem(SESSION_KEY, JSON.stringify({ pin: currentPin, nickname })); } catch (e) {}
        }
        function clearSession() {
            try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        }

        // ── Helpers ──
        const screens = document.querySelectorAll('.screen');

        function showScreen(id) {
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function ordinal(n) {
            const s = ['th', 'st', 'nd', 'rd'];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        // ── Join ──
        const pinInput = document.getElementById('pin-input');
        const nicknameInput = document.getElementById('nickname-input');
        const joinBtn = document.getElementById('join-btn');
        const joinError = document.getElementById('join-error');

        // Auto-fill PIN from URL
        const urlPin = new URLSearchParams(location.search).get('pin');
        if (urlPin) {
            pinInput.value = urlPin;
        }

        joinBtn.addEventListener('click', connect);
        nicknameInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
        pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') nicknameInput.focus(); });

        function connect() {
            const pin = pinInput.value.trim();
            const nick = nicknameInput.value.trim();

            joinError.textContent = '';

            if (!pin) {
                joinError.textContent = 'Enter a game PIN';
                return;
            }
            if (!nick) {
                joinError.textContent = 'Enter a nickname';
                return;
            }

            nickname = nick;
            currentPin = pin;
            reconnectTries = 0;
            joinBtn.disabled = true;
            joinBtn.textContent = 'Connecting...';
            saveSession();
            openSocket();
        }

        function openSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/play/${currentPin}`);

            ws.onopen = function () {
                ws.send(JSON.stringify({ type: 'join', nickname: nickname }));
            };

            ws.onmessage = function (event) {
                // Any message means we're connected — clear reconnect state.
                reconnectTries = 0;
                document.getElementById('reconnect-banner').style.display = 'none';
                handleMessage(JSON.parse(event.data));
            };

            ws.onclose = function () {
                const finalActive = document.getElementById('final-screen').classList.contains('active');
                const errorActive = document.getElementById('error-screen').classList.contains('active');
                const onJoinScreen = document.getElementById('join-screen').classList.contains('active');
                if (finalActive || errorActive || onJoinScreen) return;

                // Lost connection mid-game — try to rejoin (server restores score).
                if (reconnectTries < MAX_RECONNECT) {
                    reconnectTries++;
                    const banner = document.getElementById('reconnect-banner');
                    banner.textContent = `Reconnecting… (${reconnectTries}/${MAX_RECONNECT})`;
                    banner.style.display = 'block';
                    reconnectTimer = setTimeout(openSocket, 1500);
                } else {
                    showError('Disconnected', 'Could not reconnect to the game.');
                }
            };

            ws.onerror = function () {
                if (document.getElementById('join-screen').classList.contains('active')) {
                    joinBtn.disabled = false;
                    joinBtn.textContent = 'Join!';
                    joinError.textContent = 'Could not connect to server';
                }
            };
        }

        // ── Message handler ──
        function handleMessage(data) {
            switch (data.type) {
                case 'joined':
                    joinBtn.disabled = false;
                    joinBtn.textContent = 'Join!';
                    document.getElementById('waiting-nickname').textContent = nickname;
                    document.getElementById('waiting-avatar').textContent = data.avatar || '';
                    // Apply game background
                    if (data.background_url) {
                        const bg = document.getElementById('game-background');
                        bg.style.backgroundImage = `url(${data.background_url})`;
                        bg.style.display = 'block';
                    }
                    showScreen('waiting-screen');
                    sfx.play('pop');
                    break;

                case 'question':
                    showQuestion(data);
                    sfx.play('go');
                    break;

                case 'slide':
                    showSlide(data);
                    break;

                case 'open_question':
                    showOpenQuestion(data);
                    sfx.play('go');
                    break;

                case 'numeric_question':
                    showNumericQuestion(data);
                    sfx.play('go');
                    break;

                case 'voting':
                    showVoting(data);
                    sfx.play('go');
                    break;

                case 'answer_accepted':
                    showScreen('answered-screen');
                    break;

                case 'result':
                    showResult(data);
                    sfx.play(data.correct ? 'correct' : 'wrong');
                    break;

                case 'numeric_result':
                    showNumericResult(data);
                    sfx.play(data.got_points ? 'correct' : 'wrong');
                    break;

                case 'finished':
                    clearSession();
                    showFinal(data);
                    sfx.play('fanfare');
                    break;

                case 'game_over':
                    clearSession();
                    showError('Game Over', data.reason || 'The game has ended.');
                    break;

                case 'error':
                    clearSession();
                    joinBtn.disabled = false;
                    joinBtn.textContent = 'Join!';
                    // If still on join screen, show inline error
                    if (document.getElementById('join-screen').classList.contains('active')) {
                        joinError.textContent = data.message;
                    } else {
                        showError('Error', data.message);
                    }
                    break;
            }
        }

        // ── Question screen ──
        const shapes = ['▲', '◆', '●', '■', '⬡', '✦'];
        const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'teal'];

        function showQuestion(data) {
            document.getElementById('question-counter').textContent =
                `Question ${data.index + 1} of ${data.total}`;
            document.getElementById('question-text').textContent = data.text;

            // Question image
            const qImg = document.getElementById('question-image');
            if (data.image_url) { qImg.src = data.image_url; qImg.style.display = 'block'; }
            else { qImg.style.display = 'none'; }

            // Timer bar
            const timerBar = document.getElementById('timer-bar');
            timerBar.classList.remove('running');
            // Force reflow to restart animation
            void timerBar.offsetWidth;
            timerBar.style.animationDuration = data.time_limit + 's';
            timerBar.classList.add('running');

            // Build answer buttons
            const container = document.getElementById('answers-container');
            container.innerHTML = '';

            data.answers.forEach((answer, i) => {
                const btn = document.createElement('button');
                btn.className = `answer-btn ${colors[i]}`;
                btn.innerHTML = `<span class="shape">${shapes[i]}</span><span class="answer-text">${escapeHtml(answer)}</span>`;
                btn.addEventListener('click', () => sendAnswer(i, container));
                container.appendChild(btn);
            });

            showScreen('question-screen');
        }

        function showSlide(data) {
            document.getElementById('slide-counter').textContent =
                `Section ${data.index + 1} of ${data.total}`;
            document.getElementById('slide-text').textContent = data.text;
            const img = document.getElementById('slide-image');
            if (data.image_url) { img.src = data.image_url; img.style.display = 'block'; }
            else { img.style.display = 'none'; }
            showScreen('slide-screen');
        }

        // ── Open answer ──
        function showOpenQuestion(data) {
            document.getElementById('open-counter').textContent = `Question ${data.index + 1} of ${data.total}`;
            document.getElementById('open-text').textContent = data.text;
            const img = document.getElementById('open-image');
            if (data.image_url) { img.src = data.image_url; img.style.display = 'block'; }
            else { img.style.display = 'none'; }
            const input = document.getElementById('open-input');
            input.value = '';
            input.disabled = false;
            document.getElementById('open-submit-btn').disabled = false;
            showScreen('open-answer-screen');
            input.focus();
        }

        function submitOpen() {
            const input = document.getElementById('open-input');
            const text = input.value.trim();
            if (!text) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'open_answer', text }));
            }
            input.disabled = true;
            document.getElementById('open-submit-btn').disabled = true;
        }
        document.getElementById('open-submit-btn').addEventListener('click', submitOpen);
        document.getElementById('open-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitOpen();
        });

        // ── Numeric / closest-wins ──
        function showNumericQuestion(data) {
            document.getElementById('numeric-counter').textContent = `Question ${data.index + 1} of ${data.total}`;
            document.getElementById('numeric-text').textContent = data.text;
            const img = document.getElementById('numeric-image');
            if (data.image_url) { img.src = data.image_url; img.style.display = 'block'; }
            else { img.style.display = 'none'; }
            const input = document.getElementById('numeric-input');
            input.value = '';
            input.disabled = false;
            document.getElementById('numeric-submit-btn').disabled = false;
            // Restart timer bar
            const bar = document.getElementById('numeric-timer-bar');
            bar.classList.remove('running');
            void bar.offsetWidth;
            bar.style.animationDuration = data.time_limit + 's';
            bar.classList.add('running');
            showScreen('numeric-screen');
            input.focus();
        }

        function submitNumeric() {
            const input = document.getElementById('numeric-input');
            const raw = input.value.replace(',', '.').trim();
            if (!raw) return;
            const value = parseFloat(raw);
            if (!isFinite(value)) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'numeric_answer', value }));
            }
            input.disabled = true;
            document.getElementById('numeric-submit-btn').disabled = true;
            sfx.play('tap');
        }
        document.getElementById('numeric-submit-btn').addEventListener('click', submitNumeric);
        document.getElementById('numeric-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitNumeric();
        });

        function showNumericResult(data) {
            const icon = document.getElementById('result-icon');
            icon.textContent = data.got_points ? '✓' : '✗';
            icon.style.color = data.got_points ? '#2ecc71' : '#e74c3c';
            icon.style.animation = 'none';
            void icon.offsetWidth;
            icon.style.animation = '';

            document.getElementById('points-earned').textContent = `+${data.points || 0} points`;

            // Reuse the streak badge logic
            const streakBadge = document.getElementById('streak-badge');
            const streak = typeof data.streak === 'number' ? data.streak : 0;
            const streakMode = data.streak_mode || 'off';
            if (streak >= 2 && streakMode !== 'off') {
                const bonus = (data.points || 0) - (data.base_points || 0);
                streakBadge.innerHTML = `<span class="streak-flame">🔥</span>${streak} in a row${bonus > 0 ? `<span class="streak-bonus">+${bonus} bonus</span>` : ''}`;
                streakBadge.classList.add('visible');
            } else {
                streakBadge.classList.remove('visible');
            }

            // Reuse the answer-recap rows for "Your number" vs "Correct number"
            const recap = document.getElementById('answer-recap');
            recap.innerHTML = '';
            const yourRow = document.createElement('div');
            yourRow.className = 'recap-row ' + (data.got_points ? 'correct' : 'wrong');
            yourRow.innerHTML = `<div class="recap-label">Your number</div><div class="recap-value">${data.your_value !== null && data.your_value !== undefined ? data.your_value : '<em style="opacity:0.6">No answer</em>'}</div>`;
            recap.appendChild(yourRow);
            const correctRow = document.createElement('div');
            correctRow.className = 'recap-row correct';
            correctRow.innerHTML = `<div class="recap-label">Correct</div><div class="recap-value">${data.correct_answer !== null && data.correct_answer !== undefined ? data.correct_answer : '—'}</div>`;
            recap.appendChild(correctRow);

            // Speed/rank wording
            const speedStats = document.getElementById('speed-stats');
            const speedBar = document.getElementById('speed-bar');
            if (data.your_rank) {
                speedStats.textContent = `${ordinal(data.your_rank)} closest of ${data.total_submissions}`;
                const pct = Math.max(8, Math.min(100, 100 - (data.your_rank - 1) / Math.max(1, data.total_submissions) * 100));
                speedBar.style.width = '0%';
                requestAnimationFrame(() => { speedBar.style.width = pct + '%'; });
                speedBar.style.background = data.got_points ? '#2ecc71' : '#e74c3c';
            } else {
                speedStats.textContent = "Didn't answer in time";
                speedBar.style.width = '0%';
            }

            document.getElementById('total-score').textContent = `Total: ${data.score} points`;
            document.getElementById('rank-display').textContent =
                `${ordinal(data.rank)} of ${data.total_players} players`;
            showScreen('result-screen');
        }

        // ── Voting ──
        function showVoting(data) {
            const container = document.getElementById('vote-options');
            container.innerHTML = '';
            (data.options || []).forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `answer-btn ${colors[i % colors.length]}`;
                btn.innerHTML = `<span class="answer-text">${escapeHtml(opt)}</span>`;
                if (i === data.own_index) {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                } else {
                    btn.addEventListener('click', () => sendVote(i, container));
                }
                container.appendChild(btn);
            });
            showScreen('vote-screen');
        }

        function sendVote(i, container) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'vote', index: i }));
            }
            container.querySelectorAll('button').forEach(b => b.disabled = true);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendAnswer(index, container) {
            // Disable all buttons
            container.querySelectorAll('.answer-btn').forEach(btn => {
                btn.disabled = true;
            });

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'answer', index: index }));
            }

            sfx.play('tap');
            showScreen('answered-screen');
        }

        // ── Result screen ──
        function showResult(data) {
            // Icon
            const icon = document.getElementById('result-icon');
            icon.textContent = data.correct ? '✓' : '✗';
            icon.style.color = data.correct ? '#2ecc71' : '#e74c3c';
            // Force re-trigger animation
            icon.style.animation = 'none';
            void icon.offsetWidth;
            icon.style.animation = '';

            document.getElementById('points-earned').textContent = `+${data.points} points`;

            // Streak badge — show a flame from 2 in a row onward.
            const streakBadge = document.getElementById('streak-badge');
            const streak = typeof data.streak === 'number' ? data.streak : 0;
            const streakMode = data.streak_mode || 'off';
            if (streak >= 2 && streakMode !== 'off') {
                const bonus = (data.points || 0) - (data.base_points || 0);
                streakBadge.innerHTML = `<span class="streak-flame">🔥</span>${streak} in a row${bonus > 0 ? `<span class="streak-bonus">+${bonus} bonus</span>` : ''}`;
                streakBadge.classList.add('visible');
                streakBadge.style.animation = 'none';
                void streakBadge.offsetWidth;
                streakBadge.style.animation = '';
            } else {
                streakBadge.classList.remove('visible');
            }

            // Answer recap — what you picked vs. what was correct
            const recap = document.getElementById('answer-recap');
            recap.innerHTML = '';
            if (data.your_answer !== undefined || data.correct_answer !== undefined) {
                const yourRow = document.createElement('div');
                yourRow.className = 'recap-row ' + (data.correct ? 'correct' : 'wrong');
                yourRow.innerHTML = `<div class="recap-label">Your answer</div><div class="recap-value">${data.your_answer ? escapeHtml(data.your_answer) : '<em style="opacity:0.6">No answer</em>'}</div>`;
                recap.appendChild(yourRow);
                if (!data.correct && data.correct_answer) {
                    const correctRow = document.createElement('div');
                    correctRow.className = 'recap-row correct';
                    correctRow.innerHTML = `<div class="recap-label">Correct answer</div><div class="recap-value">${escapeHtml(data.correct_answer)}</div>`;
                    recap.appendChild(correctRow);
                }
            }

            // Speed stats
            const speedStats = document.getElementById('speed-stats');
            const speedBar = document.getElementById('speed-bar');

            if (data.time_ms > 0 && data.total_answered > 0) {
                const timeSec = (data.time_ms / 1000).toFixed(1);
                const fasterThan = Math.round(((data.total_answered - data.speed_rank) / data.total_answered) * 100);
                if (data.total_answered === 1) {
                    speedStats.textContent = `Answered in ${timeSec}s`;
                } else if (fasterThan >= 50) {
                    speedStats.textContent = `${timeSec}s — faster than ${fasterThan}% of players!`;
                } else {
                    speedStats.textContent = `${timeSec}s — ${ordinal(data.speed_rank)} fastest`;
                }
                // Bar: how fast compared to time limit (inverse: faster = more bar)
                const pct = Math.max(5, Math.min(100, 100 - (data.time_ms / (data.time_ms + data.average_ms)) * 100));
                speedBar.style.width = '0%';
                requestAnimationFrame(() => { speedBar.style.width = pct + '%'; });
                speedBar.style.background = data.correct ? '#2ecc71' : '#e74c3c';
            } else {
                speedStats.textContent = "Didn't answer in time";
                speedBar.style.width = '0%';
            }

            document.getElementById('total-score').textContent = `Total: ${data.score} points`;
            document.getElementById('rank-display').textContent =
                `${ordinal(data.rank)} of ${data.total_players} players`;
            showScreen('result-screen');
        }

        // ── Final screen ──
        function showFinal(data) {
            showScreen('final-screen');
            const rankEl = document.getElementById('final-rank');
            const scoreEl = document.getElementById('final-score');
            const lb = document.getElementById('leaderboard');
            rankEl.textContent = '';
            scoreEl.textContent = '';
            lb.innerHTML = '';

            const top5 = (data.leaderboard || []).slice(0, 5);
            const emojis = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];

            // Reveal leaderboard one by one (3rd→2nd→1st then rest)
            const revealOrder = [];
            for (let i = Math.min(2, top5.length - 1); i >= 0; i--) revealOrder.push(i);
            for (let i = 3; i < top5.length; i++) revealOrder.push(i);

            let step = 0;
            function revealRow() {
                if (step >= revealOrder.length) {
                    // Show player's own result
                    setTimeout(() => {
                        rankEl.textContent = `You finished ${ordinal(data.rank)}!`;
                        rankEl.style.animation = 'none'; void rankEl.offsetWidth;
                        rankEl.style.animation = 'screenFadeIn 0.5s ease';
                        scoreEl.textContent = `${data.score} points`;
                    }, 400);
                    return;
                }
                const i = revealOrder[step];
                const entry = top5[i];
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                row.style.opacity = '0';
                row.style.transform = 'scale(0.8)';
                row.innerHTML =
                    `<span class="lb-rank">${i < 3 ? emojis[i] : (i+1) + '.'}</span>` +
                    `<span class="lb-name">${entry.avatar ? escapeHtml(entry.avatar) + ' ' : ''}${escapeHtml(entry.nickname)}</span>` +
                    `<span class="lb-score">${entry.score}</span>`;

                // Insert in correct position
                const existing = lb.children;
                let inserted = false;
                for (let j = 0; j < existing.length; j++) {
                    if (parseInt(existing[j].dataset.pos) > i) {
                        lb.insertBefore(row, existing[j]);
                        inserted = true;
                        break;
                    }
                }
                if (!inserted) lb.appendChild(row);
                row.dataset.pos = i;

                requestAnimationFrame(() => {
                    row.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    row.style.opacity = '1';
                    row.style.transform = 'scale(1)';
                });

                step++;
                setTimeout(revealRow, step <= 3 ? 1200 : 400);
            }

            setTimeout(revealRow, 600);
        }

        // ── Error screen ──
        function showError(title, reason) {
            document.getElementById('error-title').textContent = title;
            document.getElementById('error-reason').textContent = reason || '';
            showScreen('error-screen');
        }

        // ── Navigation buttons ──
        document.getElementById('play-again-btn').addEventListener('click', resetToJoin);
        document.getElementById('rejoin-btn').addEventListener('click', resetToJoin);

        function resetToJoin() {
            clearSession();
            reconnectTries = 0;
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            document.getElementById('reconnect-banner').style.display = 'none';
            if (ws) {
                ws.onclose = null;
                ws.close();
                ws = null;
            }
            const bg = document.getElementById('game-background');
            bg.style.backgroundImage = '';
            bg.style.display = 'none';
            joinBtn.disabled = false;
            joinBtn.textContent = 'Join!';
            joinError.textContent = '';
            nicknameInput.value = '';
            showScreen('join-screen');
        }

        // Auto-reconnect after a page reload if a game session was stored.
        (function restoreSession() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) {}
            if (saved && saved.pin && saved.nickname) {
                pinInput.value = saved.pin;
                nicknameInput.value = saved.nickname;
                connect();
            }
        })();
    </script>
    <img src="https://tally.extragornax.fr/t/kahoot" alt="" width="1" height="1" style="position:absolute;opacity:0" referrerpolicy="no-referrer-when-downgrade" />
