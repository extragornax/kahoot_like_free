<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot Free - Host</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #46178f;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            min-height: 100vh;
            animation: screenFadeIn 0.4s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes screenFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Auth Screen */
        #auth-screen {
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
        }

        .auth-card h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border-radius: 8px;
            overflow: hidden;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        .auth-tab.active {
            background: #fff;
            color: #46178f;
        }

        .auth-card input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .auth-card input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .auth-card input:focus {
            border-color: #fff;
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #fff;
            color: #46178f;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .auth-submit:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .auth-error {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
            min-height: 20px;
        }

        /* Dashboard Screen */
        #dashboard-screen {
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.2);
        }

        .top-bar h1 {
            font-size: 1.8rem;
            font-weight: 900;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-white {
            background: #fff;
            color: #46178f;
        }

        .btn-red {
            background: #e21b3c;
            color: #fff;
        }

        .btn-green {
            background: #26890c;
            color: #fff;
        }

        .btn-blue {
            background: #1368ce;
            color: #fff;
        }

        .btn-small {
            padding: 8px 18px;
            font-size: 0.9rem;
        }

        .dashboard-body {
            flex: 1;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .dashboard-actions {
            margin-bottom: 30px;
        }

        .quiz-list-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px 24px;
        }

        .quiz-item-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .quiz-item-actions {
            display: flex;
            gap: 10px;
        }

        .quiz-empty {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
            font-size: 1.2rem;
        }

        /* Create Quiz Screen */
        #create-screen {
            flex-direction: column;
        }

        .create-body {
            flex: 1;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .create-body h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .question-block {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .question-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .question-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vote-options-host {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 700px;
            margin: 20px auto 0;
            width: 100%;
        }

        .vote-option {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        .move-up-btn, .move-down-btn, .add-below-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1;
        }

        .move-up-btn:hover, .move-down-btn:hover, .add-below-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .remove-question-btn {
            background: rgba(226, 27, 60, 0.6);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .remove-question-btn:hover {
            background: #e21b3c;
        }

        .answer-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .answer-row input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-size: 0.95rem;
            outline: none;
            color: #fff;
        }

        .answer-row input[type="text"]:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .answers-list .answer-row:nth-child(1) input[type="text"] { background: rgba(226, 27, 60, 0.4); }
        .answers-list .answer-row:nth-child(2) input[type="text"] { background: rgba(19, 104, 206, 0.4); }
        .answers-list .answer-row:nth-child(3) input[type="text"] { background: rgba(38, 137, 12, 0.4); }
        .answers-list .answer-row:nth-child(4) input[type="text"] { background: rgba(216, 158, 0, 0.4); }
        .answers-list .answer-row:nth-child(5) input[type="text"] { background: rgba(134, 59, 186, 0.4); }
        .answers-list .answer-row:nth-child(6) input[type="text"] { background: rgba(0, 157, 154, 0.4); }

        .q-image-row { margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
        .q-image-row .file-input { width: 0; height: 0; opacity: 0; position: absolute; }
        .q-image-btn { padding: 8px 14px; border-radius: 6px; background: rgba(255,255,255,0.15); color: #fff; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .q-image-btn:hover { background: rgba(255,255,255,0.25); }
        .q-image-preview { max-height: 80px; border-radius: 6px; }
        .q-image-name { font-size: 0.85rem; opacity: 0.7; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .answer-row input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .answer-row label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .answer-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #26890c;
            cursor: pointer;
        }

        .time-limit-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .time-limit-row input {
            width: 80px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-size: 0.95rem;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-align: center;
        }

        .time-limit-row input:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .create-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .media-uploads {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .media-upload-group {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px;
        }

        .media-upload-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .media-upload-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-input {
            width: 0;
            height: 0;
            opacity: 0;
            position: absolute;
        }

        .media-upload-row::before {
            content: 'Choose File';
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .media-filename {
            font-size: 0.85rem;
            opacity: 0.7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .media-preview {
            margin-top: 8px;
        }

        .media-preview img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 8px;
        }

        .game-background {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }

        .music-controls {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 8px 14px;
            border-radius: 20px;
            z-index: 50;
        }

        .music-controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .music-controls input[type="range"] {
            width: 80px;
            accent-color: #fff;
        }

        /* Lobby Screen */
        #lobby-screen {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            padding: 40px;
        }

        .lobby-title {
            font-size: 2rem;
            font-weight: 700;
            opacity: 0.8;
        }

        .lobby-pin {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: 12px;
            line-height: 1;
        }

        .lobby-url {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 24px;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
        }

        .lobby-players-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 10px;
        }

        .lobby-players {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 700px;
        }

        .lobby-player {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Question Screen */
        #question-screen {
            flex-direction: column;
            padding: 30px 40px;
        }

        .question-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .question-number {
            font-size: 1.2rem;
            font-weight: 700;
            opacity: 0.8;
        }

        .answer-counter {
            font-size: 1.2rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 20px;
        }

        .timer-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background: #fff;
            border-radius: 5px;
            width: 100%;
            animation: none;
        }

        @keyframes timerShrink {
            from { width: 100%; }
            to { width: 0%; }
        }

        .question-text {
            font-size: 2.4rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 40px;
            flex-shrink: 0;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
            max-height: 400px;
        }

        .answer-block {
            display: flex;
            align-items: center;
            padding: 20px 28px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            gap: 16px;
            min-height: 100px;
        }

        .answer-block.red { background: #e21b3c; }
        .answer-block.blue { background: #1368ce; }
        .answer-block.green { background: #26890c; }
        .answer-block.yellow { background: #d89e00; }
        .answer-block.purple { background: #863bba; }
        .answer-block.teal { background: #009d9a; }

        .question-image { max-height: 200px; max-width: 60%; border-radius: 12px; margin-bottom: 20px; align-self: center; object-fit: contain; }

        .answer-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
            width: 40px;
            text-align: center;
        }

        .answer-block-text {
            flex: 1;
        }

        .answer-correct-mark {
            font-size: 1.6rem;
            margin-left: auto;
            display: none;
        }

        /* Results Screen */
        #results-screen {
            flex-direction: column;
            padding: 40px;
            align-items: center;
        }

        .results-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .results-chart {
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .chart-bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .chart-bar-label {
            width: 200px;
            text-align: right;
            font-weight: 600;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .chart-bar-track {
            flex: 1;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .chart-bar-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            min-width: fit-content;
        }

        .chart-bar-fill.red { background: #e21b3c; }
        .chart-bar-fill.blue { background: #1368ce; }
        .chart-bar-fill.green { background: #26890c; }
        .chart-bar-fill.yellow { background: #d89e00; }
        .chart-bar-fill.purple { background: #863bba; }
        .chart-bar-fill.teal { background: #009d9a; }

        .chart-bar-correct {
            font-size: 0.85rem;
            margin-left: 8px;
            opacity: 0.9;
        }

        .results-leaderboard {
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .results-leaderboard h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 14px;
            text-align: center;
        }

        .leaderboard-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            opacity: 0;
            transform: translateX(-30px);
            animation: lbSlideIn 0.4s ease forwards;
        }

        .leaderboard-row.top1 {
            background: linear-gradient(90deg, rgba(245,197,24,0.3), rgba(255,255,255,0.1));
            border: 1px solid rgba(245,197,24,0.5);
            animation: lbSlideIn 0.4s ease forwards, lbGlow 1.5s ease-in-out infinite 0.5s;
        }

        @keyframes lbSlideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes lbGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(245,197,24,0); }
            50% { box-shadow: 0 0 20px rgba(245,197,24,0.4); }
        }

        .leaderboard-rank {
            font-weight: 800;
            font-size: 1.2rem;
            width: 36px;
        }

        .leaderboard-name {
            flex: 1;
            font-size: 1.1rem;
        }

        .leaderboard-score {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .leaderboard-gained {
            font-size: 0.85rem;
            color: #2ecc71;
            font-weight: 700;
            margin-left: 10px;
            min-width: 50px;
            text-align: right;
        }

        /* Final Screen */
        #final-screen {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            gap: 30px;
        }

        .final-title {
            font-size: 2.5rem;
            font-weight: 900;
        }

        .podium {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 20px;
        }

        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .podium-name {
            font-size: 1.3rem;
            font-weight: 800;
            text-align: center;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .podium-score {
            font-size: 1rem;
            opacity: 0.8;
            font-weight: 600;
        }

        .podium-bar {
            width: 140px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
        }

        .podium-1st .podium-bar {
            height: 180px;
            background: linear-gradient(to top, #d89e00, #f5c518);
        }

        .podium-2nd .podium-bar {
            height: 130px;
            background: linear-gradient(to top, #8a8a8a, #c0c0c0);
        }

        .podium-3rd .podium-bar {
            height: 90px;
            background: linear-gradient(to top, #8b5e3c, #cd7f32);
        }

        .podium-place {
            opacity: 0;
            transform: translateY(40px) scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .podium-place.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .podium-place.winner-bounce {
            animation: winnerBounce 0.8s ease 0.6s;
        }

        @keyframes winnerBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-20px) scale(1.08); }
            50% { transform: translateY(-10px) scale(1.04); }
            70% { transform: translateY(-5px) scale(1.02); }
        }

        .reveal-label {
            font-size: 2.5rem;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.5s ease;
            margin-bottom: 20px;
            text-align: center;
        }

        .reveal-label.visible { opacity: 1; }

        .confetti-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 60;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to { top: 110vh; transform: rotate(720deg); }
        }

        .final-leaderboard {
            width: 100%;
            max-width: 600px;
        }

        .final-leaderboard h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 14px;

    <input type="range" id="music-volume" min="0" max="100" value="50">
</div>
<button id="sfx-toggle" title="Toggle sound effects" style="position:fixed; bottom:16px; left:16px; z-index:50; background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:20px; padding:8px 14px; font-size:1.1rem; cursor:pointer;">&#128266;</button>
<audio id="game-audio" loop></audio>

<script>
    // --- State ---
    let currentToken = localStorage.getItem('kahoot_token');
    let ws = null;
    let authMode = 'login';
    let quizBgUrl = null;
    let quizMusicUrl = null;
    let currentTotalPlayers = 0;

    // --- Helpers ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function toast(msg) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3200);
    }

    async function apiFetch(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (currentToken) {
            headers['Authorization'] = 'Bearer ' + currentToken;
        }
        const res = await fetch(path, { ...options, headers });
        return res;
    }

    // --- Auth ---
    const authTabs = document.querySelectorAll('.auth-tab');
    const authError = document.getElementById('auth-error');
    const authSubmit = document.getElementById('auth-submit');

    authTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            authMode = tab.dataset.mode;
            authTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            authSubmit.textContent = authMode === 'login' ? 'Login' : 'Register';
            document.getElementById('auth-email').style.display = authMode === 'register' ? '' : 'none';
            authError.textContent = '';
        });
    });

    // --- Proof-of-Work solver ---
    async function solvePoW() {
        const res = await fetch('/api/auth/challenge');
        const { challenge, difficulty } = await res.json();
        const prefix = '0'.repeat(difficulty);
        const encoder = new TextEncoder();

        for (let nonce = 0; ; nonce++) {
            const input = challenge + ':' + nonce;
            const hashBuf = await crypto.subtle.digest('SHA-256', encoder.encode(input));
            const hex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
            if (hex.startsWith(prefix)) {
                return { challenge, nonce: String(nonce) };
            }
            // Yield to UI every 1000 iterations
            if (nonce % 1000 === 0 && nonce > 0) {
                await new Promise(r => setTimeout(r, 0));
            }
        }
    }

    authSubmit.addEventListener('click', async () => {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value;
        const email = document.getElementById('auth-email').value.trim();
        authError.textContent = '';

        if (!username || !password) {
            authError.textContent = 'Please fill in all fields.';
            return;
        }

        authSubmit.disabled = true;
        authSubmit.textContent = 'Verifying...';

        try {
            const pow = await solvePoW();
            const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const body = { username, password, challenge: pow.challenge, nonce: pow.nonce };
            if (authMode === 'register' && email) body.email = email;
            const res = await apiFetch(endpoint, {
                method: 'POST',
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const data = await res.json().catch(() => null);
                authError.textContent = (data && data.error) || 'Authentication failed.';
                return;
            }
            const data = await res.json();
            currentToken = data.token;
            localStorage.setItem('kahoot_token', currentToken);
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-email').value = '';
            loadDashboard();
        } catch (e) {
            authError.textContent = 'Network error. Please try again.';
        } finally {
            authSubmit.disabled = false;
            authSubmit.textContent = authMode === 'login' ? 'Login' : 'Register';
        }
    });

    // Allow Enter key to submit auth form
    document.getElementById('auth-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') authSubmit.click();
    });

    // --- Password recovery ---
    const authInfo = document.getElementById('auth-info');

    function showAuthView(view) {
        document.getElementById('auth-main').style.display = view === 'main' ? '' : 'none';
        document.getElementById('forgot-view').style.display = view === 'forgot' ? '' : 'none';
        document.getElementById('reset-view').style.display = view === 'reset' ? '' : 'none';
        authError.textContent = '';
        authInfo.style.display = 'none';
    }

    document.getElementById('forgot-link').addEventListener('click', () => showAuthView('forgot'));
    document.getElementById('forgot-back').addEventListener('click', () => showAuthView('main'));

    const forgotSubmit = document.getElementById('forgot-submit');
    forgotSubmit.addEventListener('click', async () => {
        const email = document.getElementById('forgot-email').value.trim();
        authError.textContent = '';
        if (!email) { authError.textContent = 'Please enter your email.'; return; }
        forgotSubmit.disabled = true;
        forgotSubmit.textContent = 'Verifying...';
        try {
            const pow = await solvePoW();
            await fetch('/api/auth/forgot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, challenge: pow.challenge, nonce: pow.nonce })
            });
            // Always show the same message regardless of whether the email exists.
            authInfo.textContent = 'If an account exists for that email, a reset link has been sent.';
            authInfo.style.display = 'block';
        } catch (e) {
            authError.textContent = 'Network error. Please try again.';
        } finally {
            forgotSubmit.disabled = false;
            forgotSubmit.textContent = 'Send reset link';
        }
    });

    const resetSubmit = document.getElementById('reset-submit');
    document.getElementById('reset-cancel').addEventListener('click', () => {
        history.replaceState(null, '', location.pathname);
        showAuthView('main');
    });
    resetSubmit.addEventListener('click', async () => {
        const password = document.getElementById('reset-password').value;
        const token = new URLSearchParams(location.search).get('reset');
        authError.textContent = '';
        if (!password) { authError.textContent = 'Please enter a new password.'; return; }
        resetSubmit.disabled = true;
        resetSubmit.textContent = 'Saving...';
        try {
            const res = await fetch('/api/auth/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            });
            if (!res.ok) {
                authError.textContent = 'This reset link is invalid or has expired.';
                return;
            }
            history.replaceState(null, '', location.pathname);
            document.getElementById('reset-password').value = '';
            showAuthView('main');
            authInfo.textContent = 'Password updated. You can now log in.';
            authInfo.style.display = 'block';
        } catch (e) {
            authError.textContent = 'Network error. Please try again.';
        } finally {
            resetSubmit.disabled = false;
            resetSubmit.textContent = 'Set new password';
        }
    });

    // If the page was opened from a reset link, show the reset form.
    if (new URLSearchParams(location.search).get('reset')) {
        showAuthView('reset');
    }

    // --- Logout ---
    document.getElementById('logout-btn').addEventListener('click', () => {
        currentToken = null;
        localStorage.removeItem('kahoot_token');
        if (ws) { ws.close(); ws = null; }
        clearGameMedia();
        showScreen('auth-screen');
    });

    // --- Account settings ---
    const accountOverlay = document.getElementById('account-overlay');
    const accountError = document.getElementById('account-error');
    const accountInfo = document.getElementById('account-info');
    const accountSave = document.getElementById('account-save');

    document.getElementById('account-btn').addEventListener('click', async () => {
        accountError.textContent = '';
        accountInfo.style.display = 'none';
        document.getElementById('account-new-password').value = '';
        document.getElementById('account-current-password').value = '';
        document.getElementById('account-email').value = '';
        const res = await apiFetch('/api/auth/me');
        if (res.ok) {
            const me = await res.json();
            document.getElementById('account-email').value = me.email || '';
        }
        accountOverlay.style.display = 'flex';
    });

    document.getElementById('account-cancel').addEventListener('click', () => {
        accountOverlay.style.display = 'none';
    });

    accountSave.addEventListener('click', async () => {
        const email = document.getElementById('account-email').value.trim();
        const newPassword = document.getElementById('account-new-password').value;
        const currentPassword = document.getElementById('account-current-password').value;
        accountError.textContent = '';
        accountInfo.style.display = 'none';
        if (!currentPassword) { accountError.textContent = 'Current password is required.'; return; }

        const body = { current_password: currentPassword, email };
        if (newPassword) body.new_password = newPassword;

        accountSave.disabled = true;
        accountSave.textContent = 'Saving...';
        try {
            const res = await apiFetch('/api/auth/me', { method: 'PUT', body: JSON.stringify(body) });
            if (res.status === 401) { accountError.textContent = 'Current password is incorrect.'; return; }
            if (res.status === 409) { accountError.textContent = 'That email is already in use.'; return; }
            if (!res.ok) { accountError.textContent = 'Could not save changes.'; return; }
            accountInfo.textContent = 'Account updated.';
            accountInfo.style.display = 'block';
            document.getElementById('account-new-password').value = '';
            document.getElementById('account-current-password').value = '';
        } catch (e) {
            accountError.textContent = 'Network error. Please try again.';
        } finally {
            accountSave.disabled = false;
            accountSave.textContent = 'Save changes';
        }
    });

    // --- Dashboard ---
    async function loadDashboard() {
        showScreen('dashboard-screen');
        checkAdmin();
        const list = document.getElementById('quiz-list');
        list.innerHTML = '';

        try {
            const res = await apiFetch('/api/quizzes');
            if (res.status === 401) {
                currentToken = null;
                localStorage.removeItem('kahoot_token');
                showScreen('auth-screen');
                return;
            }
            const quizzes = await res.json();
            if (!quizzes.length) {
                list.innerHTML = '<div class="quiz-empty">No quizzes yet. Create one!</div>';
                return;
            }
            quizzes.forEach(q => {
                const item = document.createElement('div');
                item.className = 'quiz-item';
                item.innerHTML = `
                    <div class="quiz-item-title">${escapeHtml(q.title)}</div>
                    <div class="quiz-item-actions">
                        <button class="btn btn-blue btn-small edit-btn" data-id="${q.id}">Edit</button>
                        <button class="btn btn-green btn-small play-btn" data-id="${q.id}">Play</button>
                        <button class="btn btn-white btn-small export-btn" data-id="${q.id}" data-title="${escapeHtml(q.title)}">Export</button>
                        <button class="btn btn-red btn-small delete-btn" data-id="${q.id}">Delete</button>
                    </div>
                `;
                list.appendChild(item);
            });

            list.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => editQuiz(btn.dataset.id));
            });
            list.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', () => startGame(btn.dataset.id));
            });
            list.querySelectorAll('.export-btn').forEach(btn => {
                btn.addEventListener('click', () => exportQuiz(btn.dataset.id, btn.dataset.title));
            });
            list.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteQuiz(btn.dataset.id));
            });
        } catch (e) {
            list.innerHTML = '<div class="quiz-empty">Failed to load quizzes.</div>';
        }
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    async function exportQuiz(id, title) {
        try {
            const res = await apiFetch('/api/quizzes/' + id + '/export.xlsx');
            if (!res.ok) { toast('Export failed.'); return; }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (title || 'quiz').replace(/[^a-z0-9]+/gi, '_') + '.xlsx';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            toast('Exported. Import it at create.kahoot.it (Add question > Import).');
        } catch (e) {
            toast('Export failed.');
        }
    }

    async function deleteQuiz(id) {
        if (!confirm('Delete this quiz?')) return;
        try {
            await apiFetch('/api/quizzes/' + id, { method: 'DELETE' });
            loadDashboard();
        } catch (e) {
            toast('Failed to delete quiz.');
        }
    }

    // --- Create / Edit Quiz ---
    let editingQuizId = null;

    function resetMediaUploads() {
        quizBgUrl = null;
        quizMusicUrl = null;
        document.getElementById('bg-filename').textContent = 'No file chosen';
        document.getElementById('bg-preview').innerHTML = '';
        document.getElementById('bg-clear').style.display = 'none';
        document.getElementById('bg-upload').value = '';
        document.getElementById('music-filename').textContent = 'No file chosen';
        document.getElementById('music-preview').style.display = 'none';
        document.getElementById('music-preview').src = '';
        document.getElementById('music-clear').style.display = 'none';
        document.getElementById('music-upload').value = '';
    }

    function setMediaPreview(type, url, name) {
        if (type === 'bg') {
            quizBgUrl = url;
            document.getElementById('bg-filename').textContent = name || url.split('/').pop();
            document.getElementById('bg-preview').innerHTML = url ? `<img src="${url}">` : '';
            document.getElementById('bg-clear').style.display = url ? 'inline-block' : 'none';
        } else {
            quizMusicUrl = url;
            document.getElementById('music-filename').textContent = name || url.split('/').pop();
            const audio = document.getElementById('music-preview');
            if (url) { audio.src = url; audio.style.display = 'block'; }
            else { audio.src = ''; audio.style.display = 'none'; }
            document.getElementById('music-clear').style.display = url ? 'inline-block' : 'none';
        }
    }

    async function uploadFile(file) {
        const form = new FormData();
        form.append('file', file);
        const headers = {};
        if (currentToken) headers['Authorization'] = 'Bearer ' + currentToken;
        const res = await fetch('/api/upload', { method: 'POST', headers, body: form });
        if (!res.ok) throw new Error('Upload failed');
        const data = await res.json();
        return data.url;
    }

    // Wire file inputs
    document.querySelector('#bg-upload').parentElement.addEventListener('click', (e) => {
        if (e.target.closest('.media-clear')) return;
        document.getElementById('bg-upload').click();
    });
    document.querySelector('#music-upload').parentElement.addEventListener('click', (e) => {
        if (e.target.closest('.media-clear')) return;
        document.getElementById('music-upload').click();
    });

    document.getElementById('bg-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
            toast('Uploading image...');
            const url = await uploadFile(file);
            setMediaPreview('bg', url, file.name);
            toast('Image uploaded!');
        } catch { toast('Upload failed.'); }
    });

    document.getElementById('music-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
            toast('Uploading audio...');
            const url = await uploadFile(file);
            setMediaPreview('music', url, file.name);
            toast('Audio uploaded!');
        } catch { toast('Upload failed.'); }
    });

    document.getElementById('bg-clear').addEventListener('click', (e) => {
        e.stopPropagation();
        setMediaPreview('bg', null, null);

    document.getElementById('music-clear').addEventListener('click', (e) => {

        setMediaPreview('music', null, null);
