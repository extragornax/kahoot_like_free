    document.getElementById('create-quiz-btn').addEventListener('click', () => {
        editingQuizId = null;
        document.getElementById('quiz-title-input').value = '';
        document.getElementById('questions-container').innerHTML = '';
        document.querySelector('#create-screen .top-bar h1').textContent = 'Create Quiz';
        resetMediaUploads();
        addQuestionBlock();
        showScreen('create-screen');
    });

    async function editQuiz(id) {
        try {
            const res = await apiFetch('/api/quizzes/' + id);
            if (!res.ok) { toast('Failed to load quiz.'); return; }
            const quiz = await res.json();

            editingQuizId = id;
            document.getElementById('quiz-title-input').value = quiz.title;
            resetMediaUploads();
            if (quiz.background_url) setMediaPreview('bg', quiz.background_url);
            if (quiz.music_url) setMediaPreview('music', quiz.music_url);
            document.querySelector('#create-screen .top-bar h1').textContent = 'Edit Quiz';
            document.getElementById('questions-container').innerHTML = '';

            (quiz.questions || []).forEach(q => {
                const n = q.answers.length;
                const k = q.kind || (n === 0 ? 'slide' : 'choice');
                const type = k === 'slide' ? 'slide' : k === 'open' ? 'open'
                    : n <= 2 ? 'tf' : n <= 4 ? 'mc4' : 'mc6';
                addQuestionBlock({
                    text: q.text,
                    time_limit_secs: q.time_limit_secs,
                    image_url: q.image_url,
                    type,
                    answers: q.answers
                });
            });

            showScreen('create-screen');
        } catch (e) {
            toast('Network error.');
        }
    }

    document.getElementById('back-to-dashboard-btn').addEventListener('click', () => {
        editingQuizId = null;
        loadDashboard();
    });

    document.getElementById('add-question-btn').addEventListener('click', () => addQuestionBlock());

    function addQuestionBlock(prefill, afterBlock) {
        const container = document.getElementById('questions-container');
        const index = container.children.length;
        const qType = (prefill && prefill.type) || 'mc4';
        const block = document.createElement('div');
        block.className = 'question-block';
        block._imageUrl = (prefill && prefill.image_url) || null;
        block.innerHTML = `
            <div class="question-header">
                <h3>Question ${index + 1}</h3>
                <div class="question-header-actions">
                    <button type="button" class="move-up-btn" title="Move up">↑</button>
                    <button type="button" class="move-down-btn" title="Move down">↓</button>
                    <button type="button" class="add-below-btn" title="Add a question below this one">+ Below</button>
                    <button class="remove-question-btn">Remove</button>
                </div>
            </div>
            <div class="question-type-row">
                <label>Type:</label>
                <select class="q-type">
                    <option value="tf"${qType === 'tf' ? ' selected' : ''}>True / False</option>
                    <option value="mc4"${qType === 'mc4' ? ' selected' : ''}>Multiple Choice (4)</option>
                    <option value="mc6"${qType === 'mc6' ? ' selected' : ''}>Multiple Choice (6)</option>
                    <option value="open"${qType === 'open' ? ' selected' : ''}>Open answer (players type + vote)</option>
                    <option value="slide"${qType === 'slide' ? ' selected' : ''}>Section / Slide (no answers)</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" class="q-text" placeholder="Question text...">
            </div>
            <div class="q-image-row">
                <input type="file" accept="image/*" class="file-input q-image-input">
                <button type="button" class="q-image-btn q-image-choose">Add Image</button>
                <span class="q-image-name">${block._imageUrl ? block._imageUrl.split('/').pop() : 'No image'}</span>
                <button type="button" class="q-image-btn q-image-clear" style="display:${block._imageUrl ? 'inline-block' : 'none'}">Remove</button>
            </div>
            <div class="q-image-preview-container">${block._imageUrl ? `<img class="q-image-preview" src="${block._imageUrl}">` : ''}</div>
            <div class="answers-list">
                <div class="answer-row"><input type="text" class="a-text" placeholder="Answer 1"><label><input type="checkbox" class="a-correct"> Correct</label></div>
                <div class="answer-row"><input type="text" class="a-text" placeholder="Answer 2"><label><input type="checkbox" class="a-correct"> Correct</label></div>
                <div class="answer-row answer-mc4"><input type="text" class="a-text" placeholder="Answer 3"><label><input type="checkbox" class="a-correct"> Correct</label></div>
                <div class="answer-row answer-mc4"><input type="text" class="a-text" placeholder="Answer 4"><label><input type="checkbox" class="a-correct"> Correct</label></div>
                <div class="answer-row answer-mc6"><input type="text" class="a-text" placeholder="Answer 5"><label><input type="checkbox" class="a-correct"> Correct</label></div>
                <div class="answer-row answer-mc6"><input type="text" class="a-text" placeholder="Answer 6"><label><input type="checkbox" class="a-correct"> Correct</label></div>
            </div>
            <div class="time-limit-row">
                <label>Time limit:</label>
                <input type="number" class="q-time" value="20" min="5" max="120"> seconds
            </div>
        `;

        const typeSelect = block.querySelector('.q-type');
        const mc4Rows = block.querySelectorAll('.answer-mc4');
        const mc6Rows = block.querySelectorAll('.answer-mc6');

        function applyType() {
            const v = typeSelect.value;
            const isSlide = v === 'slide';
            const isOpen = v === 'open';
            const noAnswers = isSlide || isOpen;
            block.querySelector('.answers-list').style.display = noAnswers ? 'none' : '';
            block.querySelector('.time-limit-row').style.display = isSlide ? 'none' : '';
            block.querySelector('.q-text').placeholder = isSlide ? 'Section title...' : 'Question text...';
            if (noAnswers) return;
            mc4Rows.forEach(r => r.style.display = (v === 'tf') ? 'none' : 'flex');
            mc6Rows.forEach(r => r.style.display = (v === 'mc6') ? 'flex' : 'none');
            if (v === 'tf') {
                const texts = block.querySelectorAll('.answers-list .a-text');
                const checks = block.querySelectorAll('.answers-list .a-correct');
                if (!texts[0].value) texts[0].value = 'True';
                if (!texts[1].value) texts[1].value = 'False';
                // Only default to True when nothing is selected yet — don't
                // clobber a saved/edited selection (e.g. False).
                if (!checks[0].checked && !checks[1].checked) checks[0].checked = true;
            }
        }
        typeSelect.addEventListener('change', applyType);

        // Image upload
        const imgInput = block.querySelector('.q-image-input');
        block.querySelector('.q-image-choose').addEventListener('click', () => imgInput.click());
        imgInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                toast('Uploading image...');
                const url = await uploadFile(file);
                block._imageUrl = url;
                block.querySelector('.q-image-name').textContent = file.name;
                block.querySelector('.q-image-preview-container').innerHTML = `<img class="q-image-preview" src="${url}">`;
                block.querySelector('.q-image-clear').style.display = 'inline-block';
                toast('Image uploaded!');
            } catch { toast('Upload failed.'); }
        });
        block.querySelector('.q-image-clear').addEventListener('click', () => {
            block._imageUrl = null;
            block.querySelector('.q-image-name').textContent = 'No image';
            block.querySelector('.q-image-preview-container').innerHTML = '';
            block.querySelector('.q-image-clear').style.display = 'none';
            imgInput.value = '';
        });

        block.querySelector('.remove-question-btn').addEventListener('click', () => {
            block.remove();
            renumberQuestions();
        });

        block.querySelector('.move-up-btn').addEventListener('click', () => {
            const prev = block.previousElementSibling;
            if (prev) {
                container.insertBefore(block, prev);
                renumberQuestions();
                block.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
        block.querySelector('.move-down-btn').addEventListener('click', () => {
            const next = block.nextElementSibling;
            if (next) {
                container.insertBefore(next, block);
                renumberQuestions();
                block.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
        block.querySelector('.add-below-btn').addEventListener('click', () => {
            addQuestionBlock(null, block);
        });

        // Prefill data
        if (prefill) {
            block.querySelector('.q-text').value = prefill.text || '';
            block.querySelector('.q-time').value = prefill.time_limit_secs || 20;
            const texts = block.querySelectorAll('.answers-list .a-text');
            const checks = block.querySelectorAll('.answers-list .a-correct');
            (prefill.answers || []).forEach((a, i) => {
                if (texts[i]) texts[i].value = a.text;
                if (checks[i]) checks[i].checked = a.is_correct;
            });
        }

        applyType();
        if (afterBlock && afterBlock.parentNode === container) {
            container.insertBefore(block, afterBlock.nextElementSibling);
            renumberQuestions();
        } else {
            container.appendChild(block);
        }
    }

    function renumberQuestions() {
        document.querySelectorAll('#questions-container .question-block').forEach((block, i) => {
            block.querySelector('h3').textContent = 'Question ' + (i + 1);
        });
    }

    document.getElementById('save-quiz-btn').addEventListener('click', async () => {
        const title = document.getElementById('quiz-title-input').value.trim();
        if (!title) { toast('Please enter a quiz title.'); return; }

        const blocks = document.querySelectorAll('#questions-container .question-block');
        if (!blocks.length) { toast('Add at least one question.'); return; }

        const questions = [];
        for (const block of blocks) {
            const text = block.querySelector('.q-text').value.trim();
            if (!text) { toast('All questions must have text.'); return; }

            const qTypeVal = block.querySelector('.q-type').value;

            // Section/slide: no answers, no scoring.
            if (qTypeVal === 'slide') {
                questions.push({ text, time_limit_secs: 20, image_url: block._imageUrl || null, kind: 'slide', answers: [] });
                continue;
            }

            // Open answer: players type, then vote. No predefined answers.
            if (qTypeVal === 'open') {
                const timeLimit = parseInt(block.querySelector('.q-time').value) || 20;
                questions.push({ text, time_limit_secs: timeLimit, image_url: block._imageUrl || null, kind: 'open', answers: [] });
                continue;
            }

            const answerCount = qTypeVal === 'tf' ? 2 : qTypeVal === 'mc6' ? 6 : 4;
            const answerTexts = block.querySelectorAll('.answers-list .a-text');
            const answerCorrects = block.querySelectorAll('.answers-list .a-correct');
            const answers = [];
            let hasCorrect = false;
            for (let i = 0; i < answerCount; i++) {
                const aText = answerTexts[i].value.trim();
                if (!aText) { toast('All visible answers must have text.'); return; }
                const isCorrect = answerCorrects[i].checked;
                if (isCorrect) hasCorrect = true;
                answers.push({ text: aText, is_correct: isCorrect });
            }
            if (!hasCorrect) { toast('Each question needs at least one correct answer.'); return; }

            const timeLimit = parseInt(block.querySelector('.q-time').value) || 20;
            questions.push({ text, time_limit_secs: timeLimit, image_url: block._imageUrl || null, kind: 'choice', answers });
        }

        try {
            let res;
            if (editingQuizId) {
                res = await apiFetch('/api/quizzes/' + editingQuizId, {
                    method: 'PUT',
                    body: JSON.stringify({ title, questions, background_url: quizBgUrl, music_url: quizMusicUrl })
                });
            } else {
                res = await apiFetch('/api/quizzes', {
                    method: 'POST',
                    body: JSON.stringify({ title, questions, background_url: quizBgUrl, music_url: quizMusicUrl })
                });
            }
            if (!res.ok) {
                const data = await res.json().catch(() => null);
                toast((data && data.error) || 'Failed to save quiz.');
                return;
            }
            toast('Quiz saved!');
            editingQuizId = null;
            loadDashboard();
        } catch (e) {
            toast('Network error. Please try again.');
        }
    });

    // --- Start Game (create game + open lobby) ---
    async function startGame(quizId) {
        try {
            const res = await apiFetch('/api/games/' + quizId, { method: 'POST' });
            if (!res.ok) {
                const data = await res.json().catch(() => null);
                toast((data && data.error) || 'Failed to create game.');
                return;
            }
            const data = await res.json();
            openLobby(data.pin);
        } catch (e) {
            toast('Network error. Please try again.');
        }
    }

    // --- WebSocket / Lobby ---
    function openLobby(pin) {
        showScreen('lobby-screen');
        document.getElementById('lobby-pin').textContent = pin;
        const playerUrl = location.origin + '/player.html?pin=' + pin;
        document.getElementById('lobby-url').textContent = playerUrl;
        // QR code
        const qrContainer = document.getElementById('lobby-qr');
        qrContainer.innerHTML = `<img src="/api/games/${pin}/qr?url=${encodeURIComponent(playerUrl)}" alt="QR Code">`;
        document.getElementById('lobby-players').innerHTML = '';
        document.getElementById('lobby-player-count').textContent = '0';
        document.getElementById('start-game-btn').disabled = true;
        currentTotalPlayers = 0;

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(protocol + '//' + location.host + '/ws/host/' + pin);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            handleWsMessage(data);
        };

        ws.onerror = () => {
            toast('WebSocket error.');
        };

        ws.onclose = () => {
            // Only show message if we're still on a game screen
            const activeScreen = document.querySelector('.screen.active');
            if (activeScreen && ['lobby-screen', 'question-screen', 'slide-screen', 'open-question-screen', 'voting-screen', 'results-screen'].includes(activeScreen.id)) {
                toast('Connection lost.');
            }
        };
    }

    document.getElementById('start-game-btn').addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'start' }));
        }
    });

    function handleWsMessage(data) {
        switch (data.type) {
            case 'lobby':
                renderLobby(data);
                break;
            case 'player_joined':
                addPlayer(data.nickname, data.player_count);
                sfx.play('pop');
                break;
            case 'player_left':
                removePlayer(data.nickname, data.player_count);
                break;
            case 'question':
                showQuestion(data);
                sfx.play('go');
                break;
            case 'slide':
                showSlide(data);
                break;
            case 'open_question':
                showOpenQuestion(data);
                sfx.play('go');
                break;
            case 'voting':
                showVoting(data);
                sfx.play('go');
                break;
            case 'answer_count':
                updateAnswerCount(data.count, data.total);
                break;
            case 'results':
                showResults(data);
                sfx.play('reveal');
                break;
            case 'finished':
                showFinal(data);
                break;
            case 'error':
                toast(data.message || 'An error occurred.');
                break;
        }
    }

    function renderLobby(data) {
        showScreen('lobby-screen');
        document.getElementById('lobby-pin').textContent = data.pin;
        const playersContainer = document.getElementById('lobby-players');
        playersContainer.innerHTML = '';
        (data.players || []).forEach(name => {
            const el = document.createElement('div');
            el.className = 'lobby-player';
            el.textContent = name;
            playersContainer.appendChild(el);
        });
        const count = (data.players || []).length;
        currentTotalPlayers = count;
        document.getElementById('lobby-player-count').textContent = count;
        document.getElementById('start-game-btn').disabled = count < 1;

        // Apply game background + music
        setGameBackground(data.background_url);
        setGameMusic(data.music_url);
    }

    function addPlayer(nickname, playerCount) {
        currentTotalPlayers = playerCount;
        const playersContainer = document.getElementById('lobby-players');
        const el = document.createElement('div');
        el.className = 'lobby-player';
        el.textContent = nickname;
        el.dataset.nickname = nickname;
        playersContainer.appendChild(el);
        document.getElementById('lobby-player-count').textContent = playerCount;
        document.getElementById('start-game-btn').disabled = playerCount < 1;
    }

    function removePlayer(nickname, playerCount) {
        currentTotalPlayers = playerCount;
        const playersContainer = document.getElementById('lobby-players');
        const el = playersContainer.querySelector(`[data-nickname="${CSS.escape(nickname)}"]`);
        if (el) el.remove();
        document.getElementById('lobby-player-count').textContent = playerCount;
        document.getElementById('start-game-btn').disabled = playerCount < 1;
    }

    // --- Question ---
    function showQuestion(data) {
        showScreen('question-screen');
        document.getElementById('question-number').textContent = 'Question ' + (data.index + 1) + ' of ' + data.total;
        document.getElementById('question-text').textContent = data.text;
        document.getElementById('answer-counter').textContent = '0 / ' + currentTotalPlayers + ' answered';

        // Question image
        const qImg = document.getElementById('question-image');
        if (data.image_url) {
            qImg.src = data.image_url;
            qImg.style.display = 'block';
        } else {
            qImg.style.display = 'none';
        }

        const grid = document.getElementById('answers-grid');
        grid.innerHTML = '';
        const n = data.answers.length;
        grid.style.gridTemplateColumns = n <= 2 ? '1fr' : n <= 4 ? '1fr 1fr' : '1fr 1fr 1fr';
        const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'teal'];
        const icons = ['\u25B2', '\u25C6', '\u25CF', '\u25A0', '\u2B23', '\u2726'];

        data.answers.forEach((ans, i) => {
            const block = document.createElement('div');
            block.className = 'answer-block ' + (colors[i] || 'blue');
            block.innerHTML = `
                <div class="answer-icon">${icons[i] || ''}</div>
                <div class="answer-block-text">${escapeHtml(ans.text)}</div>
            `;
            grid.appendChild(block);
        });

        const timerBar = document.getElementById('timer-bar');
        timerBar.style.animation = 'none';
        void timerBar.offsetWidth;
        timerBar.style.animation = 'timerShrink ' + data.time_limit + 's linear forwards';
    }

    function updateAnswerCount(count, total) {
        document.querySelectorAll('.answer-counter').forEach(el => {
            el.textContent = count + ' / ' + total + ' responded';
        });
    }

    // --- Open answer (host) ---
    function showOpenQuestion(data) {
        showScreen('open-question-screen');
        document.getElementById('open-question-number').textContent = 'Question ' + (data.index + 1) + ' of ' + data.total;
        document.getElementById('open-question-text').textContent = data.text;
        document.querySelectorAll('.answer-counter').forEach(el => el.textContent = '0 / ' + currentTotalPlayers + ' responded');
        const img = document.getElementById('open-question-image');
        if (data.image_url) { img.src = data.image_url; img.style.display = 'block'; }
        else { img.style.display = 'none'; }
        const bar = document.getElementById('open-timer-bar');
        bar.style.animation = 'none';
        void bar.offsetWidth;
        bar.style.animation = 'timerShrink ' + data.time_limit + 's linear forwards';
    }

    // --- Voting (host) ---
    function showVoting(data) {
        showScreen('voting-screen');
        document.querySelectorAll('.answer-counter').forEach(el => el.textContent = '0 / ' + currentTotalPlayers + ' responded');
        const container = document.getElementById('vote-options-host');
        container.innerHTML = '';
        (data.options || []).forEach((opt, i) => {
            const el = document.createElement('div');
            el.className = 'vote-option';
            el.textContent = (i + 1) + '. ' + opt;
            container.appendChild(el);
        });
    }

    // --- Slide / Section ---
    function showSlide(data) {
        showScreen('slide-screen');
        document.getElementById('slide-number').textContent = (data.index + 1) + ' of ' + data.total;
        document.getElementById('slide-text').textContent = data.text;
        const img = document.getElementById('slide-image');
        if (data.image_url) { img.src = data.image_url; img.style.display = 'block'; }
        else { img.style.display = 'none'; }
        document.getElementById('slide-next-btn').textContent = data.is_last ? 'Finish' : 'Next';
    }

    document.getElementById('slide-next-btn').addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'next' }));
        }
    });

    // --- Results ---
    function showResults(data) {
        showScreen('results-screen');
        const chart = document.getElementById('results-chart');
        chart.innerHTML = '';

        const maxCount = Math.max(1, ...data.answers.map(a => a.count));
        const colors = ['red', 'blue', 'green', 'yellow'];

        // Animate bars from 0 → target width
        data.answers.forEach((ans, i) => {
            const pct = (ans.count / maxCount) * 100;
            const row = document.createElement('div');
            row.className = 'chart-bar-row';
            row.innerHTML = `
                <div class="chart-bar-label">${escapeHtml(ans.text)}${ans.is_correct ? ' \u2713' : ''}</div>
                <div class="chart-bar-track">
                    <div class="chart-bar-fill ${colors[i]}" style="width: 0%">
                        ${ans.count}
                    </div>
                </div>
            `;
            chart.appendChild(row);
            // Animate after a stagger
            setTimeout(() => {
                row.querySelector('.chart-bar-fill').style.width = pct + '%';
            }, 100 + i * 150);
        });

        // Animated leaderboard (top 5) — staggered entrance
        const lb = document.getElementById('results-leaderboard');
        lb.innerHTML = '<h3>Leaderboard</h3>';
        const top5 = (data.leaderboard || []).slice(0, 5);

        top5.forEach((entry, i) => {
            const gained = entry.gained || 0;
            const row = document.createElement('div');
            row.className = 'leaderboard-row' + (i === 0 ? ' top1' : '');
            row.style.animationDelay = (0.6 + i * 0.15) + 's';
            const scoreTarget = entry.score;
            const scoreFrom = scoreTarget - gained;
            row.innerHTML = `
                <div class="leaderboard-rank">${i === 0 ? '\uD83E\uDD47' : i === 1 ? '\uD83E\uDD48' : i === 2 ? '\uD83E\uDD49' : '#' + (i+1)}</div>
                <div class="leaderboard-name">${escapeHtml(entry.nickname)}</div>
                <div class="leaderboard-score" data-from="${scoreFrom}" data-to="${scoreTarget}">${scoreFrom}</div>
                ${gained > 0 ? `<div class="leaderboard-gained">+${gained}</div>` : '<div class="leaderboard-gained"></div>'}
            `;
            lb.appendChild(row);

            // Animate score counting up
            if (gained > 0) {
                setTimeout(() => {
                    animateCount(row.querySelector('.leaderboard-score'), scoreFrom, scoreTarget, 800);
                }, 800 + i * 150);
            }
        });

        const nextBtn = document.getElementById('next-btn');
        if (data.is_last) {
            nextBtn.textContent = 'See Final Results';
        } else {
            nextBtn.textContent = 'Next Question';
        }
    }

    function animateCount(el, from, to, duration) {
        const start = performance.now();
        function tick(now) {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
            el.textContent = Math.round(from + (to - from) * eased);
            if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    document.getElementById('next-btn').addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'next' }));
        }
    });

    // --- Final ---
    function showFinal(data) {
        showScreen('final-screen');
        const leaderboard = data.leaderboard || [];

        const podium = document.getElementById('podium');
        podium.innerHTML = '';
        const revealLabel = document.getElementById('reveal-label');
        revealLabel.textContent = '';
        revealLabel.classList.remove('visible');
        const lb = document.getElementById('final-leaderboard');
        lb.innerHTML = '';
        document.getElementById('back-dashboard-final-btn').style.display = 'none';
        document.getElementById('confetti-container').innerHTML = '';

        // Build podium elements (hidden): display order 2nd, 1st, 3rd
        const podiumOrder = [1, 0, 2]; // visual positions
        const placeLabels = ['1', '2', '3'];
        const placeClasses = ['podium-1st', 'podium-2nd', 'podium-3rd'];
        const placeEmojis = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];
        const places = [];

        podiumOrder.forEach(rank => {
            const place = document.createElement('div');
            place.className = 'podium-place ' + placeClasses[rank];
            if (rank < leaderboard.length) {
                const entry = leaderboard[rank];
                place.innerHTML = `
                    <div class="podium-name">${escapeHtml(entry.nickname)}</div>
                    <div class="podium-score">${entry.score} pts</div>
                    <div class="podium-bar">${placeLabels[rank]}</div>
                `;
            } else {
                place.innerHTML = `<div class="podium-bar">${placeLabels[rank]}</div>`;
                place.style.visibility = 'hidden';
            }
            podium.appendChild(place);
            places[rank] = place;
        });

        // Dramatic reveal sequence: 3rd → 2nd → 1st
        const revealOrder = [2, 1, 0]; // reveal 3rd first
        const labels = ['3rd Place...', '2nd Place...', 'And the WINNER is...'];
        let step = 0;

        function revealNext() {
            if (step >= revealOrder.length || revealOrder[step] >= leaderboard.length) {
                // Done revealing — show full leaderboard
                finishReveal();
                return;
            }

            const rank = revealOrder[step];
            revealLabel.textContent = labels[step];
            revealLabel.classList.add('visible');

            setTimeout(() => {
                revealLabel.classList.remove('visible');
                setTimeout(() => {
                    places[rank].classList.add('revealed');
                    if (rank === 0) {
                        places[rank].classList.add('winner-bounce');
                        launchConfetti();
                        sfx.play('fanfare');
                    } else {
                        sfx.play('pop');
                    }
                    step++;
                    setTimeout(revealNext, rank === 0 ? 2000 : 1500);
                }, 400);
            }, 1200);
        }

        function finishReveal() {
            revealLabel.textContent = '';
            // Show full leaderboard
            lb.innerHTML = '<h3>Full Standings</h3>';
            leaderboard.forEach((entry, i) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row' + (i === 0 ? ' top1' : '');
                row.style.animationDelay = (i * 0.1) + 's';
                row.innerHTML = `
                    <div class="leaderboard-rank">${i < 3 ? placeEmojis[i] : '#' + (i+1)}</div>
                    <div class="leaderboard-name">${escapeHtml(entry.nickname)}</div>
                    <div class="leaderboard-score">${entry.score}</div>
                `;
                lb.appendChild(row);
            });
            document.getElementById('back-dashboard-final-btn').style.display = '';
        }

        // Gate the reveal behind the host clicking the button.
        const revealBtn = document.getElementById('reveal-leaderboard-btn');
        revealBtn.style.display = '';
        revealBtn.onclick = () => {
            revealBtn.style.display = 'none';
            sfx.play('drumroll');
            setTimeout(revealNext, 1200);
        };
    }

    function launchConfetti() {
        const container = document.getElementById('confetti-container');
        const confettiColors = ['#e21b3c', '#1368ce', '#26890c', '#d89e00', '#863bba', '#f5c518', '#ff69b4'];
        for (let i = 0; i < 80; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
            c.style.width = (6 + Math.random() * 8) + 'px';
            c.style.height = (6 + Math.random() * 8) + 'px';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            c.style.animationDuration = (2 + Math.random() * 3) + 's';
            c.style.animationDelay = (Math.random() * 1.5) + 's';
            container.appendChild(c);
        }
        setTimeout(() => { container.innerHTML = ''; }, 6000);
    }

    document.getElementById('back-dashboard-final-btn').addEventListener('click', () => {
        if (ws) { ws.close(); ws = null; }
        clearGameMedia();
        loadDashboard();
    });

    // --- Game Background & Music ---
    const gameAudio = document.getElementById('game-audio');
    const musicToggle = document.getElementById('music-toggle');
    const musicVolume = document.getElementById('music-volume');
    const musicControls = document.getElementById('music-controls');
    const gameBg = document.getElementById('game-background');

    function setGameBackground(url) {
        if (url) {
            gameBg.style.backgroundImage = `url(${url})`;
            gameBg.style.display = 'block';
        } else {
            gameBg.style.backgroundImage = '';
            gameBg.style.display = 'none';
        }
    }

    function setGameMusic(url) {
        if (url) {
            gameAudio.src = url;
            gameAudio.volume = musicVolume.value / 100;
            gameAudio.play().catch(() => {}); // autoplay may be blocked
            musicControls.style.display = 'flex';
            musicToggle.innerHTML = '&#9646;&#9646;'; // pause icon
        } else {
            gameAudio.pause();
            gameAudio.src = '';
            musicControls.style.display = 'none';
        }
    }

    function clearGameMedia() {
        setGameBackground(null);
        setGameMusic(null);
    }

    musicToggle.addEventListener('click', () => {
        if (gameAudio.paused) {
            gameAudio.play().catch(() => {});
            musicToggle.innerHTML = '&#9646;&#9646;';
        } else {
            gameAudio.pause();
            musicToggle.innerHTML = '&#9654;';
        }
    });

    musicVolume.addEventListener('input', () => {
        gameAudio.volume = musicVolume.value / 100;
    });

    // --- Sound Effects (synthesized via Web Audio API) ---
    const sfx = (() => {
        let ctx = null;
        let muted = localStorage.getItem('kahoot_sfx_muted') === '1';

        function ensureCtx() {
            if (!ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                ctx = new AC();
            }
            if (ctx.state === 'suspended') ctx.resume().catch(() => {});
            return ctx;
        }

        function tone({ freq, type = 'sine', duration = 0.15, delay = 0, gain = 0.15, freqEnd = null }) {
            const c = ensureCtx();
            if (!c) return;
            const osc = c.createOscillator();
            const g = c.createGain();
            const start = c.currentTime + delay;
            osc.type = type;
            osc.frequency.setValueAtTime(freq, start);
            if (freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), start + duration);
            g.gain.setValueAtTime(0.0001, start);
            g.gain.linearRampToValueAtTime(gain, start + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(g).connect(c.destination);
            osc.start(start);
            osc.stop(start + duration + 0.05);
        }

        function noise({ duration = 0.3, delay = 0, gain = 0.1, filterFreq = 1000 }) {
            const c = ensureCtx();
            if (!c) return;
            const buf = c.createBuffer(1, Math.floor(c.sampleRate * duration), c.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const src = c.createBufferSource();
            src.buffer = buf;
            const g = c.createGain();
            const filter = c.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = filterFreq;
            const start = c.currentTime + delay;
            g.gain.setValueAtTime(gain, start);
            g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            src.connect(filter).connect(g).connect(c.destination);
            src.start(start);
            src.stop(start + duration + 0.05);
        }

        const effects = {
            pop: () => tone({ freq: 660, type: 'sine', duration: 0.09, gain: 0.12, freqEnd: 1100 }),
            go: () => {
                tone({ freq: 523.25, duration: 0.1, gain: 0.1 });
                tone({ freq: 783.99, duration: 0.16, gain: 0.1, delay: 0.09 });
            },
            tap: () => tone({ freq: 600, type: 'triangle', duration: 0.04, gain: 0.08 }),
            correct: () => {
                tone({ freq: 659.25, type: 'triangle', duration: 0.12, gain: 0.12 });
                tone({ freq: 783.99, type: 'triangle', duration: 0.12, gain: 0.12, delay: 0.1 });
                tone({ freq: 1046.5, type: 'triangle', duration: 0.22, gain: 0.12, delay: 0.2 });
            },
            wrong: () => {
                tone({ freq: 329.63, type: 'sawtooth', duration: 0.18, gain: 0.08 });
                tone({ freq: 196, type: 'sawtooth', duration: 0.28, gain: 0.08, delay: 0.14 });
            },
            reveal: () => {
                tone({ freq: 523.25, type: 'sine', duration: 0.3, gain: 0.1 });
                tone({ freq: 783.99, type: 'sine', duration: 0.4, gain: 0.1, delay: 0.15 });
            },
            drumroll: () => {
                for (let i = 0; i < 18; i++) {
                    noise({ duration: 0.05, delay: i * 0.06, gain: 0.07, filterFreq: 380 });
                }
            },
            fanfare: () => {
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((f, i) => tone({ freq: f, type: 'triangle', duration: 0.55, gain: 0.13, delay: i * 0.11 }));
            },
        };

        function play(name) {
            if (muted) return;
            try { effects[name] && effects[name](); } catch (e) {}
        }

        function setMuted(v) {
            muted = !!v;
            localStorage.setItem('kahoot_sfx_muted', muted ? '1' : '0');
        }

        return { play, setMuted, isMuted: () => muted };
    })();

    const sfxToggle = document.getElementById('sfx-toggle');
    function refreshSfxToggle() {
        sfxToggle.innerHTML = sfx.isMuted() ? '&#128263;' : '&#128266;';
        sfxToggle.style.opacity = sfx.isMuted() ? '0.55' : '1';
    }
    refreshSfxToggle();
    sfxToggle.addEventListener('click', () => {
        sfx.setMuted(!sfx.isMuted());
        if (!sfx.isMuted()) sfx.play('pop');
        refreshSfxToggle();
    });

    // --- Admin ---
    let isAdmin = false;
    let adminSelectedUser = null;

    async function checkAdmin() {
        try {
            const res = await apiFetch('/api/auth/me');
            if (res.ok) {
                const me = await res.json();
                isAdmin = me.is_admin;
            }
        } catch {}
        document.getElementById('admin-btn').style.display = isAdmin ? '' : 'none';
    }

    document.getElementById('admin-btn').addEventListener('click', loadAdminScreen);
    document.getElementById('admin-back-btn').addEventListener('click', loadDashboard);

    async function loadAdminScreen() {
        showScreen('admin-screen');
        const list = document.getElementById('admin-user-list');
        list.innerHTML = '';
        try {
            const res = await apiFetch('/api/admin/users');
            if (!res.ok) { toast('Failed to load users.'); return; }
            const users = await res.json();
            users.forEach(u => {
                const item = document.createElement('div');
                item.className = 'quiz-item';
                item.innerHTML = `
                    <div>
                        <div class="quiz-item-title">${escapeHtml(u.username)} ${u.is_admin ? '<span style="opacity:0.6; font-size:0.85rem;">(admin)</span>' : ''}</div>
                        <div style="font-size:0.85rem; opacity:0.6; margin-top:4px;">${u.quiz_count} quizzes &middot; joined ${new Date(u.created_at).toLocaleDateString()}</div>
                    </div>
                    <div class="quiz-item-actions">
                        <button class="btn btn-blue btn-small admin-manage-btn" data-id="${u.id}" data-name="${escapeHtml(u.username)}" data-admin="${u.is_admin}">Manage</button>
                    </div>
                `;
                list.appendChild(item);
            });
            list.querySelectorAll('.admin-manage-btn').forEach(btn => {
                btn.addEventListener('click', () => openAdminModal(btn.dataset.id, btn.dataset.name, btn.dataset.admin === 'true'));
            });
        } catch { toast('Network error.'); }
    }

    function openAdminModal(userId, username, userIsAdmin) {
        adminSelectedUser = { id: userId, username, isAdmin: userIsAdmin };
        document.getElementById('admin-modal-title').textContent = username;
        document.getElementById('admin-new-password').value = '';
        const toggleBtn = document.getElementById('admin-toggle-admin');
        toggleBtn.textContent = userIsAdmin ? 'Remove Admin' : 'Make Admin';
        toggleBtn.className = userIsAdmin ? 'btn btn-small btn-red' : 'btn btn-small btn-green';
        const modal = document.getElementById('admin-modal');
        modal.style.display = 'flex';
        loadAdminUserQuizzes(userId);
    }

    document.getElementById('admin-modal-close').addEventListener('click', () => {
        document.getElementById('admin-modal').style.display = 'none';
    });

    async function loadAdminUserQuizzes(userId) {
        const container = document.getElementById('admin-user-quizzes');
        container.innerHTML = '';
        try {
            const res = await apiFetch('/api/admin/users/' + userId + '/quizzes');
            if (!res.ok) return;
            const quizzes = await res.json();
            if (!quizzes.length) { container.innerHTML = '<div style="opacity:0.5;">No quizzes</div>'; return; }
            quizzes.forEach(q => {
                const item = document.createElement('div');
                item.className = 'quiz-item';
                item.style.padding = '12px 16px';
                item.innerHTML = `
                    <div class="quiz-item-title" style="font-size:1rem;">${escapeHtml(q.title)}</div>
                    <div class="quiz-item-actions">
                        <button class="btn btn-green btn-small admin-play-quiz" data-id="${q.id}">Play</button>
                        <button class="btn btn-blue btn-small admin-edit-quiz" data-id="${q.id}" data-user="${userId}">Edit</button>
                        <button class="btn btn-red btn-small admin-del-quiz" data-id="${q.id}" data-user="${userId}">Delete</button>
                    </div>
                `;
                container.appendChild(item);
            });
            container.querySelectorAll('.admin-play-quiz').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('admin-modal').style.display = 'none';
                    startGame(btn.dataset.id);
                });
            });
            container.querySelectorAll('.admin-edit-quiz').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('admin-modal').style.display = 'none';
                    editQuiz(btn.dataset.id);
                });
            });
            container.querySelectorAll('.admin-del-quiz').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this quiz?')) return;
                    await apiFetch('/api/admin/quizzes/' + btn.dataset.id, { method: 'DELETE' });
                    loadAdminUserQuizzes(btn.dataset.user);
                    toast('Quiz deleted.');
                });
            });
        } catch {}
    }

    document.getElementById('admin-save-password').addEventListener('click', async () => {
        const pw = document.getElementById('admin-new-password').value;
        if (!pw || pw.length < 4) { toast('Password too short.'); return; }
        const res = await apiFetch('/api/admin/users/' + adminSelectedUser.id + '/password', {
            method: 'PUT',
            body: JSON.stringify({ password: pw })
        });
        if (res.ok) { toast('Password changed.'); document.getElementById('admin-new-password').value = ''; }
        else toast('Failed to change password.');
    });

    document.getElementById('admin-toggle-admin').addEventListener('click', async () => {
        const newVal = !adminSelectedUser.isAdmin;
        const res = await apiFetch('/api/admin/users/' + adminSelectedUser.id + '/admin', {
            method: 'PUT',
            body: JSON.stringify({ is_admin: newVal })
        });
        if (res.ok) {
            toast(newVal ? 'User is now admin.' : 'Admin removed.');
            document.getElementById('admin-modal').style.display = 'none';
            loadAdminScreen();
        } else toast('Failed.');
    });

    document.getElementById('admin-delete-user').addEventListener('click', async () => {
        if (!confirm('Delete user ' + adminSelectedUser.username + ' and all their quizzes?')) return;
        const res = await apiFetch('/api/admin/users/' + adminSelectedUser.id, { method: 'DELETE' });
        if (res.ok) {
            toast('User deleted.');
            document.getElementById('admin-modal').style.display = 'none';
            loadAdminScreen();
        } else toast('Failed to delete user.');
    });

    // --- Init ---
    // A reset link takes priority over an existing session.
    if (currentToken && !new URLSearchParams(location.search).get('reset')) {
        loadDashboard();
    }
</script>
