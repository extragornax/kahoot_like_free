services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kahoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kahoot}
      POSTGRES_DB: ${POSTGRES_DB:-kahoot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kahoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kahoot}:${POSTGRES_PASSWORD:-kahoot}@db:5432/${POSTGRES_DB:-kahoot}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      POW_SECRET: ${POW_SECRET:?POW_SECRET must be set (see .env.example)}
      APP_BASE_URL: ${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/static/uploads

volumes:
  pgdata:
